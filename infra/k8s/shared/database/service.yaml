# ClusterIP service for the shared engine (ADR-0003). Apps connect via
# db plus their own logical database name (orders, storefront, ...).
# The per-env overlay service patch (infra/k8s/overlays/{env}/service-patch.yaml,
# generated from ports.json) upgrades it to type NodePort with the env's
# nodePort, so kind extraPortMappings expose it to the host for health checks
# (health-probe TCP check per environment in the Grafana Service Health panel).
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: db
