# Kind cluster config for sdd-cluster
# extraPortMappings enable direct host access to NodePort services
# without needing kubectl port-forward.
#
# Host port → NodePort → Service
#  8081    →  30080   → frontend (web)
#  5002    →  30500   → backend (api)
# Note: 5001 is reserved by Nexus Docker registry (infra/nexus/compose.yml)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
      - containerPort: 30500
        hostPort: 5002
        protocol: TCP
