# Kind cluster config for sdd-cluster
# extraPortMappings enable direct host access to NodePort services
# without needing kubectl port-forward.
#
# Host port → NodePort → Service
#  8081    →  30080   → frontend (web)
#  5001    →  30500   → backend (api)
#  8083    →  30780   → openproject
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
      - containerPort: 30500
        hostPort: 5001
        protocol: TCP
      - containerPort: 30780
        hostPort: 8083
        protocol: TCP
