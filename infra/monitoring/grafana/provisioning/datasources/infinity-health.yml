apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Infinity Health
    type: yesoreyeram-infinity-datasource
    uid: infinity-health
    access: proxy
    editable: true
    jsonData:
      allowedHosts:
        - http://health-probe:8090
        - http://host.docker.internal:8088
        - http://host.docker.internal:3000
        - http://host.docker.internal:5001
        - http://host.docker.internal:8081
        - http://sdd-cluster-control-plane:30080
        - http://sdd-cluster-control-plane:30500
        - http://localhost:30080
        - http://localhost:30500
