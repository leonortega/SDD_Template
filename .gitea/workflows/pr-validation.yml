name: PR validation

on:
  pull_request:
    branches:
      - main
      - dev

# Dev flow gate: requires the `codex-reviewed` label to be set on the PR.
# The AI review-agent (dev-flow-pr-review-agent skill) applies it ONLY when
# the current-head review found ZERO findings of any severity (no
# BLOCKER/WARNING/SUGGESTION, no test gaps) AND this workflow's run for the
# head is green (success), and removes it whenever findings exist or the run
# is red/pending. The review-agent must read this run on every head and feed
# each failing step back as a BLOCKER finding. Without the label, CI fails —
# so the PR must iterate through the review-and-fix loop until clean before
# merge: at most one `codex-reviewed` label live means the PR has no
# remaining issues and its PR Validation run is green.
#
# Scan layering: local lefthook hooks (pre-commit gitleaks protect / trunk
# fmt, commit-msg contract) are the fast first line; this workflow is the
# authoritative full gate (gitleaks detect, semgrep, trivy, checkov, JSON
# validation, repo tooling tests, dev-flow label). Product tests run via the
# pre-push stack-tests hook on dev machines — never assume a tech stack.

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: sdd-e2e-ci:local
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eo pipefail
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${GITEA_TOKEN:-}"
          repo_url="http://git:${TOKEN}@host.docker.internal:3000/${GITHUB_REPOSITORY}.git"

          git init .
          git remote add origin "$repo_url"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -name '*.json' -print | while IFS= read -r file; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Secret scan (Gitleaks)
        shell: bash
        run: gitleaks detect --source . --redact --no-git

      - name: SAST scan (Semgrep)
        shell: bash
        run: |
          set -euo pipefail
          # Single source of truth: .semgrep-rules.json (committed). Fail
          # loudly instead of silently scanning with a hardcoded fallback.
          if [ ! -f .semgrep-rules.json ]; then
            echo "FAIL: .semgrep-rules.json missing - run 'configure set-semgrep-config'." >&2
            exit 1
          fi
          RULES=$(python3 -c "import json, sys; rules=json.load(open('.semgrep-rules.json')).get('rules',[]); [print(f'--config {r}') for r in rules]")
          if [ -z "${RULES:-}" ]; then
            echo "FAIL: .semgrep-rules.json contains no rules - run 'configure set-semgrep-config'." >&2
            exit 1
          fi
          semgrep scan $RULES --error --verbose . 2>&1

      - name: SCA scan (Trivy)
        shell: bash
        run: trivy fs --format table --exit-code 1 --no-progress --skip-db-update . 2>&1

      - name: IaC scan (Checkov)
        shell: bash
        run: checkov -d . --compact --config-file .checkov.yml 2>&1

      # ── Tests ──
      # Repo tooling tests: always run the shell's own Python test suite
      # (deterministic, stack-independent). Product tests (unit, integration,
      # architecture) run via the lefthook pre-push hook (`stack-tests`) so the
      # CI image stays lean — stack runtimes live on dev machines, not in
      # sdd-e2e-ci:local. Never assume a tech stack.
      - name: Repo tooling tests (SDD shell)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tools/sdd_cli/tests ]; then
            python3 -m pytest tools/sdd_cli/tests/ -q
          else
            echo "No tools/sdd_cli/tests — repo tooling tests skipped."
          fi

      - name: Dev flow gate (codex-reviewed label)
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          TOKEN="${GITEA_TOKEN:-}"
          API_URL="http://host.docker.internal:3000/api/v1/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels"
          echo "Checking codex-reviewed label on PR #${PR_NUMBER}..."
          LABELS=$(curl -s --user "git:${TOKEN}" "${API_URL}" 2>/dev/null)
          CHECK=$(echo "${LABELS}" | python3 -c "import sys, json; data=json.load(sys.stdin); names=[l.get('name','') for l in data]; sys.exit(0 if 'codex-reviewed' in names else 1)" 2>&1) && echo "PASS: codex-reviewed label found." || { echo "FAIL: codex-reviewed label not found - run dev-flow-pr-review-agent first."; exit 1; }
