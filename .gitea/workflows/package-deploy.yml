name: Package and deploy

on:
  # Deploy ONLY when a pull request targeting `dev` is MERGED (closed event
  # with merged=true). Direct pushes to dev never deploy: every change that
  # reaches the dev branch must come through a PR merge.
  pull_request:
    types:
      - closed
    branches:
      - dev
  # Explicit operator override (e.g. QA/PROD promotion from a release branch).
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev, qa, or prod)
        required: true
        default: dev
      artifact_commit_sha:
        description: >-
          QA-approved commit to deploy. For prod: PROD reuses the images pushed
          by the DEV/QA pipeline for this commit (build is skipped). Defaults to
          the dispatched ref's head commit.
        required: false
        default: ''
      release_version:
        description: Final release version recorded in release-prod.json (e.g. v1.2.3)
        required: false
        default: ''
      source_rc_version:
        description: Source RC tag recorded in release-prod.json (e.g. v1.2.3-rc.1)
        required: false
        default: ''

jobs:
  build-and-deploy:
    # Dispatch always runs. For pull_request events (already restricted to
    # `closed` PRs targeting dev), only deploy when the PR was actually
    # merged — a closed-without-merge PR must not deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    container:
      image: sdd-e2e-ci:local
      options: --user root --add-host host.docker.internal:host-gateway
    steps:
      - name: Resolve deploy SHA
        id: sha
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR merge event: deploy the MERGE COMMIT on the base branch (dev),
            # not the PR head — GITHUB_SHA for pull_request events points at the
            # head, which is not the commit that landed on dev.
            MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
            if [ -n "${MERGE_SHA}" ]; then
              echo "SHA=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
            else
              echo "SHA=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            fi
          else
            # workflow_dispatch: deploy the dispatched ref's head commit —
            # unless an explicit artifact_commit_sha is provided (PROD
            # artifact-reuse), in which case that QA-approved commit wins.
            DISPATCH_SHA="${{ github.event.inputs.artifact_commit_sha }}"
            if [ -n "${DISPATCH_SHA}" ]; then
              echo "SHA=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
            else
              echo "SHA=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eo pipefail
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${GITEA_TOKEN:-}"
          repo_url="http://git:${TOKEN}@host.docker.internal:3000/${GITHUB_REPOSITORY}.git"
          git init .
          git remote add origin "$repo_url"
          # Depth 2 so the deployable-changes gate can resolve the deploy
          # commit's parent for workflow_dispatch runs (first-parent diff).
          git fetch --depth 2 origin "${{ steps.sha.outputs.SHA }}"
          git checkout --force FETCH_HEAD

      - name: Determine environment
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR merge into dev: deploy to DEV.
            echo "ENV=dev" >> $GITHUB_OUTPUT
          else
            echo "ENV=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine target environments
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # On PR merge into dev: deploy to DEV then auto-promote to QA
            echo "TARGETS=dev qa" >> $GITHUB_OUTPUT
          else
            # On workflow_dispatch: deploy only to the specified environment
            echo "TARGETS=${{ steps.env.outputs.ENV }}" >> $GITHUB_OUTPUT
          fi

      - name: Check for deployable changes (src/ or test/ folders)
        # Deploy in ANY environment only when the change set touches a src/,
        # test/, or tests/ folder at any depth (e.g. src/..., frontend/src/...,
        # backend/tests/...). Docs, infra, and workflow-only changes must not
        # deploy. Note: only folder-based matches count — co-located test files
        # outside these folders (e.g. pkg/foo_test.go) are not matched. The gate
        # fails open when the base commit cannot be resolved or the diff cannot
        # be computed (no way to prove the change is doc-only, so do not block
        # deploys).
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ steps.sha.outputs.SHA }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR merge: the change set is the diff between the base branch head
            # and the merge commit that landed on dev.
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --depth 1 origin "${BASE_SHA}" >/dev/null 2>&1 || BASE_SHA=""
          else
            # workflow_dispatch: use the change set this commit introduces
            # (first-parent diff); the checkout fetch (depth 2) made the parent
            # object available.
            BASE_SHA=$(git rev-parse --verify "${DEPLOY_SHA}^" 2>/dev/null || echo "")
          fi

          if [ -z "${BASE_SHA}" ]; then
            echo "No base commit available — treating change as deployable."
            echo "DEPLOYABLE=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # git diff exits 0 (no differences), 1 (differences found), or >=128
          # (error). A diff error must fail OPEN — the gate is advisory and must
          # never silently block a real deploy because the diff hiccuped.
          CHANGED=$(git diff --name-only "${BASE_SHA}" "${DEPLOY_SHA}" 2>/tmp/diff-err.log) || DIFF_STATUS=$?
          DIFF_STATUS="${DIFF_STATUS:-0}"
          if [ "${DIFF_STATUS}" -gt 1 ]; then
            echo "WARNING: git diff failed (status ${DIFF_STATUS}) — treating change as deployable."
            cat /tmp/diff-err.log >&2
            echo "DEPLOYABLE=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${CHANGED}" ]; then
            echo "No changed files between ${BASE_SHA} and ${DEPLOY_SHA} — skipping deploy."
            echo "DEPLOYABLE=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "${CHANGED}" | sed 's/^/  - /'

          COUNT=$(echo "${CHANGED}" | grep -cE '(^|/)(src|test|tests)/' || true)
          if [ "${COUNT}" -gt 0 ]; then
            echo "Deployable changes found (${COUNT} path(s) under src/test)."
            echo "DEPLOYABLE=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under src/ or test(s)/ — skipping deploy."
            echo "DEPLOYABLE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker images
        # PROD skips the build entirely: it reuses the QA-approved images pushed
        # by the DEV/QA pipeline for the pinned artifact commit (never rebuild or
        # republish during PROD promotion).
        if: steps.changes.outputs.deployable == 'true' && steps.env.outputs.ENV != 'prod'
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_DOCKER_REGISTRY: ${{ secrets.NEXUS_DOCKER_REGISTRY }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          REGISTRY="${NEXUS_DOCKER_REGISTRY:-host.docker.internal:5001}"

          # Test if registry is reachable (Docker defaults to HTTPS; Nexus serves HTTP on port 5001)
          REGISTRY_REACHABLE=false
          if curl -s --connect-timeout 3 "http://${REGISTRY}/v2/" >/dev/null 2>&1; then
            REGISTRY_REACHABLE=true
            echo "Registry reachable at ${REGISTRY}"
          else
            echo "WARNING: Registry ${REGISTRY} not reachable via HTTP — will skip push"
          fi

          # Login to Nexus Docker registry (non-fatal if registry is HTTP-only and insecure-registries not set)
          LOGGED_IN=false
          if [ -n "${NEXUS_USERNAME:-}" ] && [ -n "${NEXUS_PASSWORD:-}" ]; then
            if echo "${NEXUS_PASSWORD}" | docker login "${REGISTRY}" -u "${NEXUS_USERNAME}" --password-stdin 2>/dev/null; then
              LOGGED_IN=true
              echo "Docker login successful"
            else
              echo "WARNING: Docker login failed (HTTPS fallback) — will skip push"
            fi
          fi

          # Read apps from apps.json
          APPS=$(python3 -c "
          import json
          with open('infra/deployment/apps.json') as f:
              apps = json.load(f).get('apps', [])
          for a in apps:
              print(f\"{a['appId']}|{a.get('projectPath', a['appId'])}\")
          " 2>/dev/null || echo "frontend|frontend")

          echo "${APPS}" | while IFS='|' read -r app_id project_path; do
            if [ -f "${project_path}/Dockerfile" ]; then
              IMAGE="${REGISTRY}/${app_id}:${COMMIT_SHA}"
              echo "Building ${app_id}..."
              docker build -t "${IMAGE}" -f "${project_path}/Dockerfile" "${project_path}"
              echo "${app_id} built successfully"

              if [ "$LOGGED_IN" = "true" ] && [ "$REGISTRY_REACHABLE" = "true" ]; then
                echo "Pushing ${IMAGE}..."
                docker push "${IMAGE}"
                docker tag "${IMAGE}" "${REGISTRY}/${app_id}:latest"
                docker push "${REGISTRY}/${app_id}:latest"
                echo "${app_id} pushed to registry"
              else
                echo "Skipping push for ${app_id} (registry not available)"
              fi

              # Load image into kind cluster so K8s can find it (kind's containerd
              # is separate from host Docker). Without this, ImagePullBackOff occurs
              # because kind cannot pull from the HTTP-only Nexus registry.
              echo "Loading ${app_id} into kind cluster..."
              kind load docker-image --name sdd-cluster "${IMAGE}" 2>&1 || echo "WARNING: kind load failed for ${app_id}"
            else
              echo "No Dockerfile found for ${app_id} — skipping build"
            fi
          done

      - name: Validate NodePort uniqueness across target overlays
        # Always runs (not gated on deployable changes): this is a static
        # cross-check of committed files only, and ports.json edits live under
        # infra/ — a change that touches ports but no src/test code would
        # otherwise skip the check entirely and drift silently.
        shell: bash
        run: |
          set -euo pipefail
          # Canonical source of truth: infra/deployment/ports.json. The per-env
          # service patches are generated from it (tools/sdd_cli/k8s_ports.py),
          # so this step cross-checks patches vs. the canonical file AND
          # enforces nodePort uniqueness (cluster-scoped).
          python3 << 'PYEOF'
          import json, re, sys
          from pathlib import Path

          # 1. Load canonical ports.json
          with open('infra/deployment/ports.json') as f:
              canonical = json.load(f)

          # 2. Parse nodePorts from committed service patches
          node_port_pattern = re.compile(r'^\s*nodePort:\s*(\d+)')
          overlay_dirs = [d for d in Path('infra/k8s/overlays').iterdir() if d.is_dir()]
          patch_ports = {}  # (env, app) -> port
          for overlay_dir in sorted(overlay_dirs):
              env_name = overlay_dir.name
              patch_file = overlay_dir / 'service-patch.yaml'
              if not patch_file.exists():
                  continue
              current_service = None
              for line in patch_file.read_text().split('\n'):
                  m_name = re.match(r'^  name:\s*(\S+)', line)
                  if m_name:
                      current_service = m_name.group(1)
                  m_port = node_port_pattern.search(line)
                  if m_port:
                      patch_ports[(env_name, current_service or 'unknown')] = int(m_port.group(1))

          # 3. Cross-check: every canonical mapping must be present in the patches
          for env, apps in canonical.get('environments', {}).items():
              for app, cfg in apps.items():
                  expected = cfg['nodePort']
                  actual = patch_ports.get((env, app))
                  if actual != expected:
                      print(f'DRIFT: {env}/{app} patch nodePort={actual}, '
                            f'ports.json says {expected} (run k8s_ports.write_artifacts)')
                      sys.exit(1)

          # 4. Enforce cluster-wide uniqueness across all environments
          all_ports = {}
          for (env, svc), port in sorted(patch_ports.items()):
              if port in all_ports:
                  existing = all_ports[port]
                  print(f'COLLISION: NodePort {port} used by {existing[0]}/{existing[1]}'
                        f' and {env}/{svc}')
                  sys.exit(1)
              all_ports[port] = (env, svc)

          print('NodePort validation passed (matches ports.json):')
          for port, (env, svc) in sorted(all_ports.items()):
              print(f'  {port} -> {env}/{svc}')
          PYEOF

      - name: Verify PROD artifact (reuse QA-approved images)
        # PROD must reuse the QA-approved artifact: the DEV/QA pipeline for the
        # pinned commit must have uploaded container-images.json to Nexus, and
        # every image tag must exist in the registry (otherwise PROD pods would
        # ImagePullBackOff). Fails loudly instead of deploying unverified images.
        if: steps.changes.outputs.deployable == 'true' && steps.env.outputs.ENV == 'prod'
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPOSITORY: ${{ secrets.NEXUS_REPOSITORY }}
          NEXUS_DOCKER_REGISTRY: ${{ secrets.NEXUS_DOCKER_REGISTRY }}
        shell: bash
        run: |
          set -euo pipefail
          export COMMIT_SHA=$(git rev-parse HEAD)
          NEXUS_URL="${NEXUS_URL:-http://host.docker.internal:8088}"
          REPO="${NEXUS_REPOSITORY:-sdd-artifacts}"
          REGISTRY="${NEXUS_DOCKER_REGISTRY:-host.docker.internal:5001}"
          MANIFEST_PATH="app/${COMMIT_SHA}/container-images.json"

          if [ -z "${NEXUS_USERNAME:-}" ] || [ -z "${NEXUS_PASSWORD:-}" ]; then
            echo "ERROR: PROD deployment requires NEXUS_USERNAME/NEXUS_PASSWORD to verify the QA-approved artifact."
            exit 1
          fi

          echo "Fetching ${MANIFEST_PATH} from Nexus..."
          curl -s -f --connect-timeout 5 --max-time 30 \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            "${NEXUS_URL}/repository/${REPO}/${MANIFEST_PATH}" -o /tmp/container-images.json || {
              echo "ERROR: ${MANIFEST_PATH} not found in Nexus for commit ${COMMIT_SHA}."
              echo "PROD reuses the QA-approved artifact — run the DEV/QA pipeline for this commit first."
              exit 1
            }

          python3 << 'PYEOF'
          import json, os, sys

          with open('/tmp/container-images.json') as f:
              manifest = json.load(f)

          commit_sha = os.environ['COMMIT_SHA']
          if manifest.get('commitSha') != commit_sha:
              print(f"ERROR: container-images.json commitSha {manifest.get('commitSha')!r} != {commit_sha!r}")
              sys.exit(1)

          images = manifest.get('apps', [])
          if not images:
              print("ERROR: container-images.json lists no apps to deploy")
              sys.exit(1)

          print(f"Verified QA-approved manifest for {commit_sha}:")
          for app in images:
              print(f"  {app.get('image')}")
          with open('/tmp/prod-images.txt', 'w') as f:
              for app in images:
                  f.write(app.get('image', '') + '\n')
          PYEOF

          # Verify every image tag exists in the registry.
          while IFS= read -r image; do
            [ -z "${image}" ] && continue
            repo_path="${image%:*}"
            repo_path="${repo_path#*/}"
            tag="${image##*:}"
            url="http://${REGISTRY}/v2/${repo_path}/manifests/${tag}"
            if curl -s -f --connect-timeout 5 --max-time 15 \
                -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                "${url}" >/dev/null 2>&1; then
              echo "  OK: ${image} exists in registry"
            else
              echo "ERROR: ${image} not found in registry ${REGISTRY} (run the DEV/QA pipeline for ${COMMIT_SHA} first)"
              exit 1
            fi
          done < /tmp/prod-images.txt
          echo "PROD artifact verification passed."

      - name: Deploy to K8s (all targets)
        if: steps.changes.outputs.deployable == 'true'
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          # Write kubeconfig from secret to temp file (shared across all environments)
          if [ -n "${KUBE_CONFIG_DATA:-}" ]; then
            printf '%s\n' "${KUBE_CONFIG_DATA}" > /tmp/kubeconfig
            chmod 600 /tmp/kubeconfig
            export KUBECONFIG=/tmp/kubeconfig
            echo "KUBECONFIG written to /tmp/kubeconfig"
          else
            echo "WARNING: KUBECONFIG secret not set — kubectl may fail to authenticate"
          fi

          REGISTRY="${NEXUS_DOCKER_REGISTRY:-host.docker.internal:5001}"
          COMMIT_SHA=$(git rev-parse HEAD)
          REPO_ROOT=$(pwd)
          APPS_JSON="${REPO_ROOT}/infra/deployment/apps.json"

          for ENV in ${{ steps.targets.outputs.TARGETS }}; do
            echo ""
            echo "=== Deploying to ${ENV} ==="

            OVERLAY_DIR="infra/k8s/overlays/${ENV}"

            if [ ! -d "${OVERLAY_DIR}" ]; then
              echo "No K8s overlay found for ${ENV} — skipping"
              continue
            fi

            # Ensure K8s namespace exists
            NAMESPACE="sdd-${ENV}"
            if ! kubectl get namespace "${NAMESPACE}" > /dev/null 2>&1; then
              echo "Creating namespace ${NAMESPACE}..."
              kubectl create namespace "${NAMESPACE}"
            fi

            # Diagnostics: tool versions and connectivity
            echo "=== K8s Deploy Diagnostics (${ENV}) ==="
            echo "kustomize: $(kustomize version 2>&1)"
            echo "kubectl: $(kubectl version --client 2>&1 | head -1)"
            echo "K8s API: $(kubectl cluster-info --request-timeout=5s 2>&1 | head -3)"
            echo "Environment: ${ENV}"
            echo "Namespace: ${NAMESPACE}"
            echo "Overlay: ${OVERLAY_DIR}"
            echo "================================"

            # Read apps and set image tags
            cd "${OVERLAY_DIR}"

          python3 -c "
          import json, subprocess, os
          apps_json = '${APPS_JSON}'
          registry = '${REGISTRY}'
          commit_sha = '${COMMIT_SHA}'
          with open(apps_json) as f:
              apps = json.load(f).get('apps', [])
          for app in apps:
              app_id = app['appId']
              image = f'{registry}/{app_id}:{commit_sha}'
              subprocess.run(['kustomize', 'edit', 'set', 'image', image], check=True)
              print(f'Set image for {app_id}: {image}')
          "

            # Build manifest to temp file
            echo "Building K8s manifest..."
            kustomize build . > /tmp/k8s-manifest.yaml 2>/tmp/kustomize-err.log
            if [ ! -s /tmp/k8s-manifest.yaml ]; then
              echo "ERROR: kustomize build produced empty output"
              cat /tmp/kustomize-err.log
              exit 1
            fi
            echo "Manifest size: $(wc -l < /tmp/k8s-manifest.yaml) lines"

            # Delete existing apps to avoid "field is immutable" errors when K8s
            # resources change their selector/matchLabels (e.g. commonLabels→labels).
            # The CI pipeline is the sole deployer, so delete-then-recreate is safe.
            echo "Removing existing apps for clean apply..."
            # Delete existing deployments to avoid "field is immutable" errors when
            # spec.selector.matchLabels changes (e.g. commonLabels→labels migration).
            # Services are NOT deleted — their selectors are mutable.
          python3 << PYEOF
          import json, subprocess
          apps_json = '${APPS_JSON}'
          namespace = '${NAMESPACE}'
          with open(apps_json) as f:
              apps = json.load(f).get('apps', [])
          for app in apps:
              app_id = app['appId']
              subprocess.run(['kubectl', '-n', namespace, 'delete', 'deploy', app_id, '--ignore-not-found'], check=False)
          PYEOF

            # Apply to K8s
            echo "Deploying to ${ENV}..."
            if ! kubectl apply -f /tmp/k8s-manifest.yaml 2>&1; then
              echo "ERROR: kubectl apply failed - running dry-run for diagnosis..."
              kubectl apply --dry-run=client -f /tmp/k8s-manifest.yaml 2>&1 | head -20
              exit 1
            fi

            # Wait for rollout of each app
          python3 -c "
          import json, subprocess
          namespace = 'sdd-${ENV}'
          with open('${APPS_JSON}') as f:
              apps = json.load(f).get('apps', [])
          for app in apps:
              app_id = app['appId']
              print(f'Waiting for rollout of {app_id} in {namespace}...')
              subprocess.run(
                  ['kubectl', '-n', namespace, 'rollout', 'status', 'deployment', app_id, '--timeout=120s'],
                  check=False
              )
          "

            cd "${REPO_ROOT}"
            echo "=== ${ENV} deployment complete ==="
          done

      - name: Prune old local images (keep newest commit tags per app)
        # Skipped for PROD: no build happens, so there is nothing new to prune,
        # and pruning must not remove images other environments still run.
        if: steps.changes.outputs.deployable == 'true' && steps.env.outputs.ENV != 'prod'
        env:
          NEXUS_DOCKER_REGISTRY: ${{ secrets.NEXUS_DOCKER_REGISTRY }}
          LOCAL_IMAGE_KEEP: ${{ secrets.LOCAL_IMAGE_KEEP }}
        shell: bash
        run: |
          set -euo pipefail
          # The runner builds against the host Docker daemon (socket mount), so
          # every deploy leaves ${REGISTRY}/{app}:<commitSha> tags in the LOCAL
          # image store that never get pruned. Keep the newest KEEP commit tags
          # per app (the current build is always newest) and remove the rest.
          # Default 3; override with the LOCAL_IMAGE_KEEP repository secret.
          export REGISTRY="${NEXUS_DOCKER_REGISTRY:-host.docker.internal:5001}"
          export KEEP="${LOCAL_IMAGE_KEEP:-3}"
          echo "Pruning old ${REGISTRY} images (keeping newest ${KEEP} commit tags per app)..."
          DELETE=$(docker images --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' | sort -r | python3 -c "
          import os
          import sys

          registry = os.environ['REGISTRY']
          keep = int(os.environ['KEEP'])
          prefix = registry + '/'
          counts = {}
          hex_chars = '0123456789abcdef'

          for line in sys.stdin:
              _created, tag = line.rstrip('\n').split('\t', 1)
              if not tag.startswith(prefix):
                  continue
              rest = tag[len(prefix):]
              app, sep, sha = rest.rpartition(':')
              if not sep or len(sha) != 40 or any(c not in hex_chars for c in sha):
                  continue
              if counts.get(app, 0) < keep:
                  counts[app] = counts.get(app, 0) + 1
                  continue
              print(tag)
          ") || true
          if [ -n "${DELETE}" ]; then
            echo "Removing old local images:"
            echo "${DELETE}" | sed 's/^/  - /'
            # rmi is non-fatal: an image still in use (e.g. by the current
            # build) must not abort the job.
            echo "${DELETE}" | xargs -r docker rmi || echo "WARNING: some images could not be removed (in use)"
          else
            echo "No old commit tags to prune."
          fi
          # Drop any images left dangling by the untagging above.
          docker image prune -f >/dev/null 2>&1 || true

      - name: Prune old images in kind cluster (keep current build per app)
        # Skipped for PROD: same rationale as the local prune — the PROD run
        # builds nothing, so kind must keep every image other environments run.
        if: steps.changes.outputs.deployable == 'true' && steps.env.outputs.ENV != 'prod'
        env:
          NEXUS_DOCKER_REGISTRY: ${{ secrets.NEXUS_DOCKER_REGISTRY }}
        shell: bash
        run: |
          set -euo pipefail
          # kind's containerd accumulates one ${REGISTRY}/{app}:<commitSha> tag
          # per deploy, separate from the host daemon. The cluster only needs the
          # CURRENT build's tag (pods run it; old tags are never pulled), so
          # prune every older SHA tag per app. crictl dedups by digest, so use
          # ctr inside the node for per-tag listing. Non-fatal: a failed prune
          # must never fail the deploy, and the current build is always kept.
          export REGISTRY="${NEXUS_DOCKER_REGISTRY:-host.docker.internal:5001}"
          export CURRENT="$(git rev-parse HEAD)"
          KIND_NODE="${KIND_NODE:-sdd-cluster-control-plane}"
          if ! docker inspect "${KIND_NODE}" >/dev/null 2>&1; then
            echo "WARNING: kind node ${KIND_NODE} not found - skipping kind prune"
            exit 0
          fi
          # Safety guard: only prune when the CURRENT build's image is present in
          # kind. If HEAD moved past the deployed images (e.g. re-run without a
          # new deploy), pruned tags would leave running pods without their image.
          # NOTE trade-off: this keeps ONLY the current build's tags, so a
          # workflow_dispatch deploy to one env (while another env still runs an
          # older SHA, e.g. prod) prunes that env's older images from kind. Running
          # pods are unaffected until they restart; re-deploying that env restores
          # the restart image.
          CURRENT_LOADED=$(docker exec "${KIND_NODE}" ctr -n k8s.io images list 2>/dev/null \
            | grep -c "${REGISTRY}/.*:${CURRENT}" || true)
          if [ "${CURRENT_LOADED}" -eq 0 ]; then
            echo "WARNING: current build (${CURRENT}) not loaded in kind - skipping prune to protect deployed images"
            exit 0
          fi
          echo "Pruning old images in kind node ${KIND_NODE} (keeping current build ${CURRENT})..."
          OLD=$(docker exec "${KIND_NODE}" ctr -n k8s.io images list 2>/dev/null | python3 -c "
          import os, sys

          registry = os.environ['REGISTRY']
          current = os.environ['CURRENT']
          prefix = registry + '/'
          hex_chars = '0123456789abcdef'

          for line in sys.stdin:
              fields = line.split()
              if not fields:
                  continue
              ref = fields[0]
              if not ref.startswith(prefix):
                  continue
              rest = ref[len(prefix):]
              app, sep, sha = rest.rpartition(':')
              if not sep or len(sha) != 40 or any(c not in hex_chars for c in sha):
                  continue
              if sha == current:
                  continue  # never prune the build this run deployed
              print(ref.rstrip())
          " | tr -d '\r') || true
          if [ -n "${OLD}" ]; then
            echo "Removing old images from kind:"
            echo "${OLD}" | sed 's/^/  - /'
            # Strip CRs (Windows checkouts) — a trailing \r makes ctr report
            # "image not found". Pass refs as a single arg list (ctr accepts
            # multiple images); xargs would misparse the docker exec args.
            # shellcheck disable=SC2086
            docker exec "${KIND_NODE}" ctr -n k8s.io images rm ${OLD//$'\r'/} || echo "WARNING: some kind images could not be removed"
          else
            echo "No old images to prune in kind."
          fi

      - name: Discover environment URLs (all targets)
        if: steps.changes.outputs.deployable == 'true'
        id: urls
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          # Write kubeconfig from secret to temp file (needed for kubectl in this step)
          if [ -n "${KUBE_CONFIG_DATA:-}" ]; then
            printf '%s\n' "${KUBE_CONFIG_DATA}" > /tmp/kubeconfig
            export KUBECONFIG=/tmp/kubeconfig
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          mkdir -p "app/${COMMIT_SHA}"

          for ENV in ${{ steps.targets.outputs.TARGETS }}; do
            echo "=== Discovering ${ENV} URLs ==="
            export ENV
            # Single Python script: discover nodePorts + write JSON manifest
          python3 << 'PYEOF'
          import json, os, subprocess

          env = os.environ.get('ENV', 'dev')
          commit_sha = os.environ.get('COMMIT_SHA',
              subprocess.run(['git', 'rev-parse', 'HEAD'],
                  capture_output=True, text=True).stdout.strip())
          namespace = f"sdd-{env}"

          # Read apps from apps.json
          apps = []
          if os.path.exists('infra/deployment/apps.json'):
              with open('infra/deployment/apps.json') as f:
                  config = json.load(f)
              apps = config.get('apps', [])
          else:
              apps = [{'appId': 'frontend', 'healthPath': '/health'}]

          discovered = []
          for app in apps:
              app_id = app['appId']
              health_path = app.get('healthPath', '/health')

              # Discover nodePort from K8s service
              node_port = ''
              try:
                  result = subprocess.run(
                      ['kubectl', '-n', namespace, 'get', 'svc', app_id,
                       '-o', 'jsonpath={.spec.ports[0].nodePort}',
                       '--request-timeout=3s'],
                      capture_output=True, text=True, timeout=10
                  )
                  if result.returncode == 0 and result.stdout.strip():
                      node_port = result.stdout.strip()
              except Exception as e:
                  print(f"  Warning: kubectl failed for {app_id}: {e}")

              url = f'http://localhost:{node_port}' if node_port else ''
              health_url = f'{url}{health_path}' if url else ''

              discovered.append({
                  'appId': app_id,
                  'url': url,
                  'healthUrl': health_url,
                  'healthPath': health_path
              })

              if url:
                  print(f"  {app_id}: {url}")
              else:
                  print(f"  {app_id}: not deployed (port-forward needed)")

          manifest = {
              'environment': env,
              'commitSha': commit_sha,
              'apps': discovered,
              'timestamp': subprocess.run(
                  ['date', '-u', '+%Y-%m-%dT%H:%M:%SZ'],
                  capture_output=True, text=True).stdout.strip()
          }

          urls_file = f'app/{commit_sha}/env-urls-{env}.json'
          with open(urls_file, 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f"\nURL manifest saved to {urls_file}")
          print(json.dumps(manifest, indent=2))
          PYEOF
          done

      - name: Verify PROD health (page + /health smoke checks)
        # PROD success requires direct page + /health verification in the
        # workflow itself (contract: dev-ops-deploy-prod). Apps are exposed on
        # the host via kind extraPortMappings (canonical host ports in
        # infra/deployment/ports.json); host.docker.internal reaches the host
        # from the CI container (container option --add-host host-gateway).
        if: steps.changes.outputs.deployable == 'true' && steps.env.outputs.ENV == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, subprocess, sys

          with open('infra/deployment/ports.json') as f:
              ports = json.load(f)
          with open('infra/deployment/apps.json') as f:
              config = json.load(f)

          apps = config.get('apps', [])
          if not apps:
              print('ERROR: no apps configured in infra/deployment/apps.json — nothing to verify')
              sys.exit(1)
          prod_ports = ports.get('environments', {}).get('prod', {})
          failures = []

          for app in apps:
              app_id = app['appId']
              health_path = app.get('healthPath', '/health')
              host_port = prod_ports.get(app_id, {}).get('hostPort')
              if not host_port:
                  print(f'WARNING: no prod hostPort for {app_id} — skipping health check')
                  continue
              url = f'http://host.docker.internal:{host_port}'
              print(f'Checking {app_id}: {url}{health_path}')
              try:
                  result = subprocess.run(
                      ['curl', '-s', '--fail', '--max-time', '10', f'{url}{health_path}'],
                      capture_output=True, text=True, timeout=20
                  )
                  if result.returncode != 0:
                      failures.append(f'{app_id}: /health failed ({result.stderr.strip() or "HTTP error"})')
                      continue
                  ok = False
                  try:
                      body = json.loads(result.stdout)
                      ok = body.get('status') == 'ok'
                  except Exception:
                      ok = '"ok"' in result.stdout
                  if ok:
                      print(f'  PASS: {app_id} /health OK')
                  else:
                      failures.append(f'{app_id}: /health did not return status=ok ({result.stdout[:120]!r})')
              except Exception as exc:
                  failures.append(f'{app_id}: health check error ({exc})')

          if failures:
              print('PROD health verification FAILED:')
              for failure in failures:
                  print(f'  - {failure}')
              sys.exit(1)
          print('PROD health verification passed.')
          PYEOF

      - name: Generate Nexus metadata artifacts
        if: steps.changes.outputs.deployable == 'true'
        env:
          # Optional PROD release metadata (workflow_dispatch inputs); empty for
          # PR-merge runs — release-{env}.json falls back to version 0.1.0.
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          SOURCE_RC_VERSION: ${{ github.event.inputs.source_rc_version }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          mkdir -p "app/${COMMIT_SHA}"

          # Write commit.sha (shared across all environments)
          echo "${COMMIT_SHA}" > "app/${COMMIT_SHA}/commit.sha"

          # Write deployable-apps.json from apps.json (shared across all environments)
          python3 << PYEOF
          import json

          commit_sha = "${COMMIT_SHA}"

          with open('infra/deployment/apps.json') as f:
              deploy_config = json.load(f)

          deployable = {
              'version': 1,
              'commitSha': commit_sha,
              'apps': [
                  {
                      'appId': app['appId'],
                      'artifactName': f'{app["appId"]}-sdd-app.zip',
                      'healthPath': app.get('healthPath', '/health'),
                      'role': app.get('role', 'web'),
                      'deployOrder': app.get('deployOrder', 0)
                  }
                  for app in deploy_config.get('apps', [])
              ]
          }

          with open(f'app/{commit_sha}/deployable-apps.json', 'w') as f:
              json.dump(deployable, f, indent=2)
          print('Created deployable-apps.json')
          PYEOF

          # Write container-images.json (for deployment tracking, shared across all environments)
          python3 << PYEOF
          import json, os

          commit_sha = "${COMMIT_SHA}"
          registry = "${NEXUS_DOCKER_REGISTRY:-host.docker.internal:5001}"

          with open('infra/deployment/apps.json') as f:
              deploy_config = json.load(f)

          images = {
              'version': 1,
              'commitSha': commit_sha,
              'apps': [
                  {
                      'appId': app['appId'],
                      'image': f'{registry}/{app["appId"]}:{commit_sha}'
                  }
                  for app in deploy_config.get('apps', [])
              ]
          }

          path = f'app/{commit_sha}/container-images.json'
          with open(path, 'w') as f:
              json.dump(images, f, indent=2)
          print(f'Created {path}')
          PYEOF

          # Extract ticket key from the latest commit message (e.g. 'E2EPROJECT-37: ...')
          TICKET_KEY=$(git log -1 --format='%s' | grep -oE '[A-Z]+-[0-9]+' | head -1 || echo '')

          # Write release.json per deployed environment
          RELEASE_VERSION="${RELEASE_VERSION:-0.1.0}"
          SOURCE_RC_VERSION="${SOURCE_RC_VERSION:-}"
          for ENV in ${{ steps.targets.outputs.TARGETS }}; do
            echo "=== Generating release metadata for ${ENV} ==="
          python3 << PYEOF
          import json
          from datetime import datetime, timezone

          commit_sha = "${COMMIT_SHA}"
          env = "${ENV}"
          ticket_key = "${TICKET_KEY}"

          release = {
              'version': "${RELEASE_VERSION}",
              'commitSha': commit_sha,
              'environment': env,
              'timestamp': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'versionStatus': 'unversioned'
          }
          if "${SOURCE_RC_VERSION}" != "":
              release['sourceRcVersion'] = "${SOURCE_RC_VERSION}"
          if ticket_key:
              release['ticketKey'] = ticket_key

          path = f'app/{commit_sha}/release-{env}.json'
          with open(path, 'w') as f:
              json.dump(release, f, indent=2)
          print(f'Created {path}')
          print(f'  version: {release["version"]}')
          print(f'  ticketKey: {ticket_key or "(not found)"}')
          if release.get('sourceRcVersion'):
              print(f'  sourceRcVersion: {release["sourceRcVersion"]}')
          PYEOF
          done

      - name: Upload artifacts to Nexus
        if: steps.changes.outputs.deployable == 'true'
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPOSITORY: ${{ secrets.NEXUS_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          ARTIFACT_DIR="app/${COMMIT_SHA}"
          NEXUS_URL="${NEXUS_URL:-http://host.docker.internal:8088}"
          REPO="${NEXUS_REPOSITORY:-sdd-artifacts}"

          if [ ! -d "${ARTIFACT_DIR}" ]; then
            echo "No artifacts to upload"
            exit 0
          fi

          if [ -z "${NEXUS_USERNAME:-}" ] || [ -z "${NEXUS_PASSWORD:-}" ]; then
            echo "Nexus credentials not set — skipping upload"
            exit 0
          fi

          UPLOAD_FAILED=0
          for file in $(find "${ARTIFACT_DIR}" -type f); do
            remote_path="${file}"
            echo "Uploading ${file} to ${NEXUS_URL}/repository/${REPO}/${remote_path}"
            if ! curl -s -f -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
              --upload-file "${file}" \
              "${NEXUS_URL}/repository/${REPO}/${remote_path}" \
              -w "HTTP:%{http_code}\n"; then
              echo "ERROR: Failed to upload ${file} — see HTTP code in preceding line"
              UPLOAD_FAILED=1
            fi
          done

          # Upload latest env URLs pointer for every deployed environment
          for file in $(find "${ARTIFACT_DIR}" -type f -name "env-urls-*.json"); do
            filename=$(basename "$file")
            env_name="${filename#env-urls-}"
            env_name="${env_name%.json}"
            LATEST_PATH="app/latest/env-urls-${env_name}.json"
            echo "Uploading ${file} as ${LATEST_PATH}"
            curl -s -f -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
              -X PUT \
              --upload-file "${file}" \
              "${NEXUS_URL}/repository/${REPO}/${LATEST_PATH}" || true
          done

          if [ "$UPLOAD_FAILED" = "1" ]; then
            echo "WARNING: Some artifacts failed to upload to Nexus"
          fi

          echo "Upload complete"
