# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  # Third-party installed community skills and generated eval artifacts are
  # vendor content, not repo-authored code; keep them out of the lint gate.
  ignore:
    - linters: [ALL]
      paths:
        - .codex/skills/**
        - .codex/agent-evals/**
  enabled:
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.9
    - git-diff-check
    - gitleaks@8.30.1
    - hadolint@2.15.1
    - isort@8.0.1
    - markdownlint@0.49.1
    - oxipng@10.1.1
    - prettier@3.9.6
    - ruff@0.16.1
    - semgrep@1.172.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - svgo@4.0.2
    - taplo@0.10.0
    - yamllint@1.38.0
actions:
  # Trunk's own git-hook actions stay disabled: lefthook.yml owns pre-commit /
  # pre-push / commit-msg and already runs `trunk fmt` + `trunk check` there,
  # so enabling trunk's native hooks would double-run (a lefthook stash-restore
  # conflict with trunk-fmt was recovered from in E2EPROJECT-39).
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
