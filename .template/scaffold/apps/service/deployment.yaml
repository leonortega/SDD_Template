apiVersion: apps/v1
kind: Deployment
metadata:
  name: <appId>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <appId>
  template:
    metadata:
      labels:
        app: <appId>
    spec:
      containers:
        - name: <appId>
          image: host.docker.internal:5001/<appId>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: <port>   # role containerPort from infra/deployment/roles.json
          # Emitted for roles with "portEnv": true in roles.json (e.g. api) — the
          # generated Dockerfile consumes PORT (ASPNETCORE_URLS, uvicorn port, ...).
          # AUTH_SECRET is emitted for api-role apps that consume the auth-lib
          # package: it reads the JWT signing secret from the externally
          # provisioned 'auth-credentials' secret (kubectl create secret generic
          # auth-credentials --from-literal=secret=<value>); optional: true keeps
          # the lab runnable unprovisioned (app falls back to its demo secret).
          env:
            - name: PORT
              value: "<port>"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-credentials
                  key: secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: <port>
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: <port>
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
